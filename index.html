
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>هند - الملف الشخصي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@200..1000&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #2b241e;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
        .music-range::-webkit-slider-runnable-track {
            background: rgba(255, 255, 255, 0.1);
            height: 3px;
            border-radius: 99px;
        }
        .music-range::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 12px;
            width: 12px;
            border-radius: 50%;
            background: white;
            margin-top: -4.5px;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #2b241e;
        }
        ::-webkit-scrollbar-thumb {
            background: #4a3d32;
            border-radius: 10px;
        }
    </style>
</head>
<body class="bg-[#2b241e] text-white">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect } = React;
        const { motion } = window.Motion;

        const MusicPlayer = () => {
            const [isPlaying, setIsPlaying] = useState(false);
            const [progress, setProgress] = useState(0);
            const [currentTime, setCurrentTime] = useState(0);
            const [duration, setDuration] = useState(0);
            const audioRef = useRef(null);

            const audioUrl = "https://a.top4top.io/m_3869xicey1.m4a";
            const coverImg = "https://i.top4top.io/p_3869jjc3d1.jpg";

            useEffect(() => {
                const audio = audioRef.current;
                if (!audio) return;

                const updateProgress = () => {
                    setProgress((audio.currentTime / (audio.duration || 1)) * 100);
                    setCurrentTime(audio.currentTime);
                };

                const onLoadMetadata = () => {
                    setDuration(audio.duration);
                };

                audio.addEventListener('timeupdate', updateProgress);
                audio.addEventListener('loadedmetadata', onLoadMetadata);

                return () => {
                    audio.removeEventListener('timeupdate', updateProgress);
                    audio.removeEventListener('loadedmetadata', onLoadMetadata);
                };
            }, []);

            const togglePlay = () => {
                if (audioRef.current) {
                    if (isPlaying) {
                        audioRef.current.pause();
                    } else {
                        audioRef.current.play();
                    }
                    setIsPlaying(!isPlaying);
                }
            };

            const formatTime = (time) => {
                const minutes = Math.floor(time / 60);
                const seconds = Math.floor(time % 60);
                return `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
            };

            const handleSeek = (e) => {
                const seekTime = (Number(e.target.value) / 100) * (duration || 1);
                if (audioRef.current) {
                    audioRef.current.currentTime = seekTime;
                }
            };

            return (
                <div className="bg-black rounded-[45px] p-5 flex flex-col h-full shadow-2xl border border-white/5 relative overflow-hidden">
                    <div className="absolute top-2 left-1/2 -translate-x-1/2 w-20 h-5 bg-black z-20 rounded-b-2xl" />
                    
                    <div className="relative h-[250px] overflow-hidden rounded-[35px] mb-6 mt-4">
                        <img src={coverImg} className="w-full h-full object-cover" />
                        <div className="absolute inset-0 bg-gradient-to-t from-black/40 to-transparent" />
                    </div>

                    <div className="px-1">
                        <div className="flex justify-between items-center mb-6">
                            <div>
                                <h3 className="text-white text-xl font-bold tracking-tight">هند</h3>
                                <div className="flex items-center gap-1 mt-1">
                                    <div className="w-1.5 h-1.5 bg-white/40 rounded-full animate-pulse" />
                                    <p className="text-white/40 text-[10px] uppercase font-bold tracking-widest">Now Playing</p>
                                </div>
                            </div>
                            <div className="text-white/80">
                                <div className="w-6 h-6 border-2 border-white/20 rounded-full flex items-center justify-center">
                                    <div className="w-2 h-2 bg-white/60 rounded-full" />
                                </div>
                            </div>
                        </div>

                        <div className="mb-8">
                            <div className="flex justify-between text-[10px] font-bold text-white/40 mb-2">
                                <span>{formatTime(currentTime)}</span>
                                <span>-{formatTime(duration - currentTime)}</span>
                            </div>
                            <input 
                                type="range" min="0" max="100" 
                                value={isNaN(progress) ? 0 : progress}
                                onChange={handleSeek}
                                className="w-full h-[3px] bg-white/10 rounded-full appearance-none cursor-pointer accent-white overflow-hidden music-range"
                            />
                        </div>

                        <div className="flex justify-between items-center px-6 mb-4">
                            <button className="text-white/90"><i data-lucide="skip-back" fill="currentColor"></i></button>
                            <button onClick={togglePlay} className="w-16 h-16 bg-white rounded-full flex items-center justify-center text-black hover:scale-105 active:scale-95 transition-all shadow-lg">
                                {isPlaying ? <i data-lucide="pause" fill="currentColor"></i> : <i data-lucide="play" className="ml-1" fill="currentColor"></i>}
                            </button>
                            <button className="text-white/90"><i data-lucide="skip-forward" fill="currentColor"></i></button>
                        </div>
                        
                        <div className="flex items-center gap-3 px-4 mt-8 opacity-40">
                           <div className="w-1.5 h-1.5 bg-white rounded-full" />
                           <div className="flex-grow h-1 bg-white/20 rounded-full relative">
                              <div className="absolute left-0 top-0 h-full w-2/3 bg-white rounded-full" />
                              <div className="absolute left-2/3 top-1/2 -translate-y-1/2 w-2 h-2 bg-white rounded-full" />
                           </div>
                           <div className="w-2.5 h-2.5 bg-white rounded-full" />
                        </div>

                        <audio ref={audioRef} src={audioUrl} />
                    </div>
                </div>
            );
        };

        const TelegramCard = () => {
            return (
                <div className="bg-black rounded-[50px] p-6 h-full flex flex-col shadow-2xl border border-white/5">
                    <div className="bg-[#2b241e] rounded-[40px] p-8 flex-grow flex flex-col justify-between relative overflow-hidden">
                        <div className="absolute top-[-20%] left-[-10%] w-60 h-60 bg-white/5 rounded-full blur-3xl" />
                        <div className="flex flex-col h-full">
                            <div className="flex justify-between items-start mb-2">
                                <div>
                                    <h2 className="text-white text-3xl font-extrabold mb-1 tracking-tight">هند</h2>
                                    <p className="text-white/60 text-sm mb-6 font-medium">حسابي تلي</p>
                                </div>
                                <div className="text-white/60">
                                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 12m-9 0a9 9 0 1 0 18 0a9 9 0 1 0 -18 0"></path><path d="M12 12m-1 0a1 1 0 1 0 2 0a1 1 0 1 0 -2 0"></path><path d="M12 7v5"></path><path d="M12 16v.01"></path></svg>
                                </div>
                            </div>
                            
                            <div className="flex flex-grow flex-col items-center justify-center gap-6">
                                <a href="https://t.me/uuukuk" target="_blank" rel="noopener noreferrer" className="group flex flex-col items-center gap-6">
                                    <div className="bg-black/40 backdrop-blur-xl p-10 rounded-[45px] border border-white/10 shadow-2xl group-hover:scale-105 group-hover:bg-black/60 transition-all duration-500">
                                        <svg viewBox="0 0 24 24" className="w-20 h-20 text-white fill-current"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.79 5.42-1.12 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69.01-.03.01-.14-.07-.2-.08-.06-.19-.04-.27-.02-.11.02-1.87 1.18-5.28 3.48-.5.35-.95.52-1.35.51-.44-.01-1.29-.25-1.92-.45-.77-.25-1.38-.38-1.33-.81.03-.22.33-.45.91-.7 3.56-1.55 5.94-2.58 7.14-3.08 3.39-1.43 4.09-1.68 4.55-1.69.1 0 .33.02.48.15.13.11.17.26.19.37z" /></svg>
                                    </div>
                                    <div className="flex items-center gap-3 bg-black/30 backdrop-blur-md px-6 py-3 rounded-2xl border border-white/5 group-hover:border-white/20 transition-all">
                                        <span className="text-white text-lg font-bold tracking-wide">@uuukuk</span>
                                        <div className="w-2 h-2 bg-green-500 rounded-full animate-pulse" />
                                    </div>
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            useEffect(() => { lucide.createIcons(); }, []);
            
            return (
                <div className="min-h-screen bg-[#3D3128] text-white p-4 sm:p-8 lg:p-12 overflow-x-hidden">
                    <div className="max-w-4xl mx-auto">
                        <motion.header initial={{ y: -50, opacity: 0 }} animate={{ y: 0, opacity: 1 }} className="bg-black rounded-full px-4 py-5 flex items-center justify-center mb-8 shadow-2xl border border-white/5">
                            <div className="flex justify-around w-full items-center px-4">
                                <div className="text-center min-w-[80px]">
                                    <p className="text-white text-[11px] sm:text-sm font-bold">هند</p>
                                    <p className="text-white/40 text-[9px] sm:text-[10px]">Facebook</p>
                                </div>
                                <div className="text-center min-w-[80px]">
                                    <p className="text-white text-[11px] sm:text-sm font-bold">Hind</p>
                                    <p className="text-white/40 text-[9px] sm:text-[10px]">Telegram</p>
                                </div>
                                <div className="text-center min-w-[80px]">
                                    <p className="text-white text-[11px] sm:text-sm font-bold">@uuukuk</p>
                                    <p className="text-white/40 text-[9px] sm:text-[10px]">Username</p>
                                </div>
                            </div>
                        </motion.header>

                        <motion.div initial={{ scale: 0.9, opacity: 0 }} animate={{ scale: 1, opacity: 1 }} className="bg-black rounded-[50px] p-6 mb-8 relative shadow-2xl border border-white/5">
                            <div className="relative rounded-[40px] overflow-hidden mb-6 h-[400px] sm:h-[500px]">
                                <img src="https://i.top4top.io/p_3869jjc3d1.jpg" className="w-full h-full object-cover brightness-75" />
                                <div className="absolute bottom-6 right-6 w-32 h-32 rounded-[40px] overflow-hidden border-8 border-black shadow-2xl">
                                    <img src="https://i.top4top.io/p_3869jjc3d1.jpg" className="w-full h-full object-cover" />
                                </div>
                            </div>
                            <div className="px-4 pb-4 text-right">
                                <h1 className="text-4xl sm:text-5xl font-black mb-3">هند</h1>
                                <p className="text-white/70 text-sm sm:text-base leading-relaxed max-w-3xl font-medium">أنا لست نسخة من أحد، حضوري وحده يكفي. أسخر كل طاقاتي للتعبير عن ذاتي بطرق مبتكرة وفريدة.</p>
                            </div>
                        </motion.div>

                        <div className="grid grid-cols-1 md:grid-cols-5 gap-8 mb-8">
                            <div className="md:col-span-3 h-[500px]"><TelegramCard /></div>
                            <div className="md:col-span-2 h-[500px]"><MusicPlayer /></div>
                        </div>

                        <motion.div initial={{ y: 50, opacity: 0 }} whileInView={{ y: 0, opacity: 1 }} viewport={{ once: true }} className="bg-black rounded-[40px] p-8 text-center shadow-2xl border border-white/5 relative overflow-hidden group">
                            <p className="text-2xl sm:text-3xl italic text-[#D7C4B7]">"أنا لست نسخة من أحد، حضوري وحده يكفي."</p>
                        </motion.div>
                        
                        <div className="mt-12 text-center text-white/20 text-[10px] uppercase tracking-[0.2em] pb-8">&copy; 2024 Hind • Professional Portfolio</div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
